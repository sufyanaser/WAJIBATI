name: Capacitor dependencies validation
on:
  push:
    branches:
      - feature/ios-capacitor-codemagic
    paths:
      - '.github/workflows/capacitor-dependencies.yml'
      - 'src/test/homework.test.ts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-validate-and-lock:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder
      VITE_VAPID_PUBLIC_KEY: placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Capacitor 7 and update lockfile
        run: |
          npm ci
          npm install --save-exact @capacitor/core@7 @capacitor/ios@7
          npm install --save-dev --save-exact @capacitor/cli@7
      - name: Verify reproducible installation
        run: npm ci
      - name: TypeScript lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Unit and integration tests
        run: npm test
      - name: Check package and lockfile changes
        run: |
          git diff --check
          git status --short
          git diff --stat
      - name: Commit validated dependency and lockfile updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(ios): lock validated Capacitor 7 dependencies"
            git push origin HEAD:feature/ios-capacitor-codemagic
          fi
