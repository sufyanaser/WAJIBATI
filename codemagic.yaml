workflows:
  ios-capacitor-unsigned:
    name: Wajibati iOS - unsigned validation
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Validate TypeScript and build
        script: |
          npm run lint
          npm run build
          npm test
      - name: Prepare Capacitor iOS project
        script: |
          npx cap add ios
          npx cap sync ios
          cd ios/App
          pod install
      - name: Build unsigned iOS application
        script: |
          xcodebuild \
            -workspace "$CM_BUILD_DIR/ios/App/App.xcworkspace" \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/ios-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - ios-derived/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log
